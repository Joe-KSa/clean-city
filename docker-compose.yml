version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: cleancity_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cleancity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: cleancity_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
